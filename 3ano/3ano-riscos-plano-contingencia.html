<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3º Ano — Plano de Contingência | ZyPlay</title>
<meta name="theme-color" content="#0b5f3c">

<style>
:root{
  --bg:#0b0f19;--panel:rgba(16,24,43,.45);--line:rgba(255,255,255,.10);
  --text:#eaf0ff;--ok:#23d5ab;--bad:#ff4d6d
}
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui;background:var(--bg);
  color:var(--text);display:flex;justify-content:center;
  align-items:center;min-height:100vh;padding:20px
}
.container{
  width:100%;max-width:1000px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:20px
}
button{
  margin-top:10px;padding:10px 14px;border-radius:10px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  color:white;font-weight:bold;cursor:pointer;width:100%;
  text-align:left
}
button:hover{background:rgba(255,255,255,.08)}
.ok{color:var(--ok);font-weight:bold}
.bad{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="container">
<h1>Plano de Contingência</h1>

<p id="cenario">Clique em "Novo Cenário"</p>

<div id="opcoes"></div>

<button onclick="novo()">Novo Cenário</button>
<button onclick="verificar()">Verificar</button>

<p id="resultado"></p>
<p>Pontos: <span id="score">0</span></p>

</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function beep(type="ok"){
  if(!audioCtx) audioCtx=new AudioCtx();
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.value= type==="ok"?800:200;
  gain.gain.setValueAtTime(0.2,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);
  osc.start();
  osc.stop(audioCtx.currentTime+0.2);
}

const cenarios=[
{
texto:"Servidor da empresa caiu e o sistema financeiro está indisponível.",
respostas:[
{t:"Ignorar e esperar voltar sozinho.", ok:false},
{t:"Ativar backup, restaurar sistema e comunicar equipe.", ok:true},
{t:"Desligar todos os computadores.", ok:false}
]
},
{
texto:"Fornecedor principal entrou em greve.",
respostas:[
{t:"Parar totalmente a produção.", ok:false},
{t:"Acionar fornecedor alternativo previsto em contrato.", ok:true},
{t:"Cancelar pedidos dos clientes.", ok:false}
]
},
{
texto:"Ataque de phishing atingiu e-mails corporativos.",
respostas:[
{t:"Não avisar ninguém para evitar pânico.", ok:false},
{t:"Bloquear acessos, alterar senhas e treinar equipe.", ok:true},
{t:"Continuar usando normalmente.", ok:false}
]
}
];

let atual=null;
let escolha=null;
let score=0;

function novo(){
  escolha=null;
  atual=cenarios[Math.floor(Math.random()*cenarios.length)];
  document.getElementById("cenario").innerText=atual.texto;
  const div=document.getElementById("opcoes");
  div.innerHTML="";
  atual.respostas.forEach((r,i)=>{
    const btn=document.createElement("button");
    btn.innerText=r.t;
    btn.onclick=()=>{escolha=i;};
    div.appendChild(btn);
  });
}

function verificar(){
  if(atual===null || escolha===null){
    document.getElementById("resultado").innerHTML="<span class='bad'>Selecione uma opção.</span>";
    beep("bad");
    return;
  }

  if(atual.respostas[escolha].ok){
    score+=15;
    document.getElementById("resultado").innerHTML="<span class='ok'>Plano adequado!</span>";
    beep("ok");
  }else{
    score-=5;
    document.getElementById("resultado").innerHTML="<span class='bad'>Reveja as boas práticas de contingência.</span>";
    beep("bad");
  }

  document.getElementById("score").innerText=score;
}
</script>

</body>
</html>
