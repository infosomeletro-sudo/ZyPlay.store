<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3º Ano — Custo de Transporte | ZyPlay</title>
<meta name="theme-color" content="#0b5f3c">

<style>
:root{
--bg:#0b0f19;--panel:rgba(16,24,43,.45);--line:rgba(255,255,255,.10);
--t:#eaf0ff;--m:#a9b7d0;--ok:#23d5ab;--bad:#ff4d6d;--b:#0ea35a
}
body{
margin:0;font-family:Arial, sans-serif;background:var(--bg);
color:var(--t);display:flex;justify-content:center;padding:20px
}
.wrap{width:100%;max-width:1100px;background:var(--panel);
border:1px solid var(--line);border-radius:14px;overflow:hidden}
.header{padding:15px;border-bottom:1px solid var(--line);
display:flex;justify-content:space-between;align-items:center}
button{
padding:8px 14px;border-radius:999px;border:1px solid var(--line);
background:rgba(255,255,255,.05);color:white;font-weight:bold;cursor:pointer
}
button:hover{background:rgba(255,255,255,.1)}
.primary{background:rgba(14,163,90,.2);border-color:rgba(14,163,90,.4)}
.danger{background:rgba(255,77,109,.2);border-color:rgba(255,77,109,.4)}
.container{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.container{grid-template-columns:1fr}}
.card{border:1px solid var(--line);padding:15px;border-radius:12px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
input{
width:100%;padding:8px;border-radius:8px;
background:#111;border:1px solid var(--line);color:white
}
.msg{margin-top:10px;font-size:14px}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}
.stat{background:#111;padding:10px;border-radius:10px;text-align:center}
.big{font-size:18px;font-weight:bold;margin-top:5px}
</style>
</head>

<body>
<div class="wrap">

<div class="header">
<div><b>Custo de Transporte</b><br><small>3º Ano • Ferramentas Digitais para Logísticas • ZyPlay</small></div>
<div>
<button class="primary" onclick="novo()">Novo cenário</button>
<button onclick="conferir()">Conferir</button>
<button class="danger" onclick="resetar()">Reset</button>
</div>
</div>

<div class="container">

<div class="card">
<h3>Dados da Operação</h3>
<table id="tabela"></table>

<label>Custo total da operação (R$)</label>
<input type="number" id="resposta" placeholder="Ex: 2450.00">

<div id="mensagem" class="msg"></div>
</div>

<div class="card">
<h3>Pontuação</h3>

<div class="stats">
<div class="stat">Rodadas<div class="big" id="rodadas">0</div></div>
<div class="stat">Acertos<div class="big" id="acertos">0</div></div>
<div class="stat">Erros<div class="big" id="erros">0</div></div>
<div class="stat">Pontos<div class="big" id="pontos">0</div></div>
</div>

<div id="feedback" class="msg"></div>
</div>

</div>
</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx=null;
function beep(tipo="ok"){
try{
if(!ctx) ctx=new AudioCtx();
const o=ctx.createOscillator();
const g=ctx.createGain();
o.connect(g); g.connect(ctx.destination);
o.type="sine";
o.frequency.value = tipo==="ok"?800:220;
g.gain.setValueAtTime(0.2,ctx.currentTime);
o.start(); o.stop(ctx.currentTime+0.2);
}catch(e){}
}

function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function round2(x){return Math.round(x*100)/100}

let atual=null;
let rodadas=0, acertos=0, erros=0, pontos=0;

function atualizar(){
document.getElementById("rodadas").innerText=rodadas;
document.getElementById("acertos").innerText=acertos;
document.getElementById("erros").innerText=erros;
document.getElementById("pontos").innerText=pontos;
}

function novo(){
rodadas++;

let distancia=r(50,800);
let custoKm=r(2,8);
let pedagio=r(20,150);
let qtdPedagios=r(1,6);
let cargaExtra=r(100,600);

let total = round2(distancia*custoKm + (pedagio*qtdPedagios) + cargaExtra);

atual={distancia,custoKm,pedagio,qtdPedagios,cargaExtra,total};

document.getElementById("tabela").innerHTML=
`
<tr><th>Distância (km)</th><td>${distancia}</td></tr>
<tr><th>Custo por km (R$)</th><td>${custoKm}</td></tr>
<tr><th>Pedágio (R$)</th><td>${pedagio}</td></tr>
<tr><th>Qtd Pedágios</th><td>${qtdPedagios}</td></tr>
<tr><th>Taxa carga/seguro (R$)</th><td>${cargaExtra}</td></tr>
`;

document.getElementById("mensagem").innerText="Calcule: (distância × custo/km) + pedágios + taxa extra.";
document.getElementById("resposta").value="";
document.getElementById("feedback").innerText="";
beep();
atualizar();
}

function conferir(){
if(!atual){return}

let resp = Number(document.getElementById("resposta").value);
if(!resp){return}

if(Math.abs(resp-atual.total)<=0.1){
acertos++;
pontos+=12;
document.getElementById("mensagem").innerHTML="<span class='ok'>✅ Correto!</span>";
document.getElementById("feedback").innerText="Boa! Você calculou custo logístico completo.";
beep("ok");
}else{
erros++;
pontos=Math.max(0,pontos-5);
document.getElementById("mensagem").innerHTML="<span class='bad'>❌ Correto era: R$ "+atual.total+"</span>";
document.getElementById("feedback").innerText="Revise fórmula de custo total.";
beep("bad");
}
atualizar();
}

function resetar(){
rodadas=0;acertos=0;erros=0;pontos=0;
document.getElementById("tabela").innerHTML="";
document.getElementById("mensagem").innerText="Clique em Novo cenário.";
document.getElementById("feedback").innerText="";
document.getElementById("resposta").value="";
atual=null;
atualizar();
}

resetar();
</script>

</body>
</html>
