<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2º Ano — Controle de Estoque | ZyPlay</title>
<meta name="theme-color" content="#0b5f3c">

<style>
:root{
  --bg:#0b0f19;
  --panel:rgba(16,24,43,.45);
  --line:rgba(255,255,255,.10);
  --text:#eaf0ff;
  --ok:#23d5ab;
  --bad:#ff4d6d;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}
.container{
  width:100%;
  max-width:900px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
}
h1{margin-top:0}
input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  color:white;
}
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:rgba(255,255,255,.08)}
.status{margin-top:15px;font-weight:bold}
.ok{color:var(--ok)}
.bad{color:var(--bad)}
.stats{margin-top:15px}
</style>
</head>
<body>

<div class="container">
<h1>Simulador — Controle de Estoque</h1>

<label>Produto</label>
<input type="text" id="produto" placeholder="Digite o nome do produto">

<label>Quantidade</label>
<input type="number" id="quantidade" placeholder="Digite a quantidade">

<button onclick="entrada()">Registrar Entrada</button>
<button onclick="saida()">Registrar Saída</button>

<div class="status" id="status"></div>

<div class="stats">
  <h3>Estoque Atual</h3>
  <div id="estoque"></div>
</div>

</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function beep(type="ok"){
  if(!audioCtx) audioCtx = new AudioCtx();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type="sine";
  osc.frequency.value = type==="ok"?800:200;
  gain.gain.setValueAtTime(0.2,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);
  osc.start();
  osc.stop(audioCtx.currentTime+0.2);
}

let estoque = {};

function atualizarEstoque(){
  const div=document.getElementById("estoque");
  div.innerHTML="";
  for(let item in estoque){
    div.innerHTML += `<p>${item}: ${estoque[item]}</p>`;
  }
}

function entrada(){
  const produto=document.getElementById("produto").value;
  const quantidade=parseInt(document.getElementById("quantidade").value);
  if(!produto || quantidade<=0){
    document.getElementById("status").innerText="Dados inválidos.";
    document.getElementById("status").className="status bad";
    beep("bad");
    return;
  }
  estoque[produto]=(estoque[produto]||0)+quantidade;
  document.getElementById("status").innerText="Entrada registrada.";
  document.getElementById("status").className="status ok";
  beep("ok");
  atualizarEstoque();
}

function saida(){
  const produto=document.getElementById("produto").value;
  const quantidade=parseInt(document.getElementById("quantidade").value);
  if(!produto || quantidade<=0 || !estoque[produto] || estoque[produto]<quantidade){
    document.getElementById("status").innerText="Saída inválida.";
    document.getElementById("status").className="status bad";
    beep("bad");
    return;
  }
  estoque[produto]-=quantidade;
  document.getElementById("status").innerText="Saída registrada.";
  document.getElementById("status").className="status ok";
  beep("ok");
  atualizarEstoque();
}
</script>

</body>
</html>
