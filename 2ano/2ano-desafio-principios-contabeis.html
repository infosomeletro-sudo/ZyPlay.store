<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2º Ano — Desafio Princípios Contábeis | ZyPlay</title>
<meta name="theme-color" content="#0b5f3c">

<style>
:root{
  --bg:#0b0f19;
  --panel:rgba(16,24,43,.45);
  --line:rgba(255,255,255,.10);
  --text:#eaf0ff;
  --ok:#23d5ab;
  --bad:#ff4d6d;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}
.container{
  width:100%;
  max-width:900px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
}
h1{margin-top:0}
.question{
  margin:20px 0;
  font-size:18px;
  font-weight:bold;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:rgba(255,255,255,.08)}
.status{margin-top:15px;font-weight:bold}
.ok{color:var(--ok)}
.bad{color:var(--bad)}
.stats{margin-top:15px;display:flex;gap:20px}
.primary{margin-top:20px;background:rgba(14,163,90,.25)}
</style>
</head>
<body>

<div class="container">
<h1>Desafio — Princípios Contábeis</h1>

<div class="question" id="question">Clique em iniciar</div>
<div id="options"></div>

<div class="status" id="status"></div>

<div class="stats">
  <div>Questão: <span id="round">0</span></div>
  <div>Pontos: <span id="score">0</span></div>
</div>

<button class="primary" onclick="startGame()">Iniciar</button>
<button onclick="nextQuestion()">Próxima</button>

</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function beep(type="ok"){
  if(!audioCtx) audioCtx = new AudioCtx();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type="sine";
  osc.frequency.value = type==="ok"?800:200;
  gain.gain.setValueAtTime(0.2,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);
  osc.start();
  osc.stop(audioCtx.currentTime+0.2);
}

const questions = [
{
  q:"O princípio da Entidade determina que:",
  options:[
    "O patrimônio da empresa não se confunde com o do sócio",
    "Toda despesa é lucro",
    "Caixa é sempre passivo",
    "Receita é despesa"
  ],
  answer:0
},
{
  q:"O princípio da Competência reconhece:",
  options:[
    "Receitas e despesas no período em que ocorrem",
    "Somente quando paga",
    "Somente quando recebe",
    "Apenas no final do ano"
  ],
  answer:0
},
{
  q:"O princípio da Continuidade presume que:",
  options:[
    "A empresa continuará em operação",
    "A empresa irá fechar",
    "Não há controle financeiro",
    "O sócio pode usar o caixa"
  ],
  answer:0
},
{
  q:"O princípio da Prudência recomenda:",
  options:[
    "Registrar perdas prováveis e não antecipar lucros incertos",
    "Aumentar lucros fictícios",
    "Ignorar despesas",
    "Esconder dívidas"
  ],
  answer:0
}
];

let index=0;
let score=0;
let started=false;

function startGame(){
  index=0;
  score=0;
  started=true;
  showQuestion();
}

function showQuestion(){
  if(index>=questions.length){
    document.getElementById("question").innerText="Fim do desafio!";
    document.getElementById("options").innerHTML="";
    return;
  }

  const q=questions[index];
  document.getElementById("question").innerText=q.q;
  document.getElementById("round").innerText=index+1;

  const optionsDiv=document.getElementById("options");
  optionsDiv.innerHTML="";

  q.options.forEach((opt,i)=>{
    const btn=document.createElement("button");
    btn.innerText=opt;
    btn.onclick=()=>checkAnswer(i);
    optionsDiv.appendChild(btn);
  });
}

function checkAnswer(i){
  if(!started) return;
  const q=questions[index];
  if(i===q.answer){
    score+=10;
    document.getElementById("status").innerText="Correto!";
    document.getElementById("status").className="status ok";
    beep("ok");
  }else{
    score-=5;
    document.getElementById("status").innerText="Errado!";
    document.getElementById("status").className="status bad";
    beep("bad");
  }
  document.getElementById("score").innerText=score;
}

function nextQuestion(){
  if(!started) return;
  index++;
  showQuestion();
}
</script>

</body>
</html>
