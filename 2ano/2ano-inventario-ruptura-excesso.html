<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>2º Ano — Ruptura x Excesso | Inventário | ZyPlay</title>
<meta name="theme-color" content="#0b5f3c" />
<style>
:root{--bg:#0b0f19;--panel:rgba(16,24,43,.45);--line:rgba(255,255,255,.10);--t:#eaf0ff;--m:#a9b7d0;--ok:#23d5ab;--bad:#ff4d6d;--b:#0ea35a;--r:16px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--t);
background:radial-gradient(1000px 700px at 10% 0%, rgba(14,163,90,.22), transparent 55%),
radial-gradient(1000px 700px at 90% 0%, rgba(11,42,82,.18), transparent 55%),var(--bg);
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:min(1100px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.03)}
.brand{display:flex;align-items:center;gap:10px;font-weight:1000}
.badge{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--b),var(--ok));display:grid;place-items:center}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--t);padding:10px 12px;border-radius:999px;cursor:pointer;font-weight:900;transition:.15s}
button:hover{transform:translateY(-1px);background:rgba(255,255,255,.06)}
.primary{border-color:rgba(14,163,90,.35);background:rgba(14,163,90,.16)}
.danger{border-color:rgba(255,77,109,.35);background:rgba(255,77,109,.12)}
.b{padding:16px;display:grid;grid-template-columns:1.1fr .9fr;gap:12px}
@media(max-width:980px){.b{grid-template-columns:1fr}}
.card{padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:10px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03)}
.k{color:var(--m);font-size:12px;text-transform:uppercase;letter-spacing:.35px}
.v{font-weight:1000;font-size:18px;margin-top:4px}
label{display:block;color:var(--m);font-size:12px;margin-bottom:6px}
input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.18);color:var(--t);outline:none}
.msg{min-height:18px;color:var(--m);font-size:13px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
th{color:var(--t);font-weight:1000}
small{color:var(--m)}
</style>
</head>
<body>
<div class="wrap">
  <div class="h">
    <div class="brand"><div class="badge">Z</div>
      <div>Ruptura x Excesso (Inventário) <small style="display:block;color:var(--m);font-weight:700">2º Ano • ZyPlay</small></div>
    </div>
    <div class="ctrl">
      <button class="primary" id="start">Iniciar</button>
      <button id="next">Próximo mês</button>
      <button class="danger" id="reset">Reset</button>
    </div>
  </div>

  <div class="b">
    <section class="card">
      <div class="stats">
        <div class="stat"><div class="k">Mês</div><div class="v" id="mth">0/12</div></div>
        <div class="stat"><div class="k">Estoque</div><div class="v" id="stk">0</div></div>
        <div class="stat"><div class="k">Rupturas</div><div class="v" id="rup">0</div></div>
        <div class="stat"><div class="k">Pontos</div><div class="v" id="sc">0</div></div>
      </div>

      <div style="height:10px"></div>

      <div class="card" style="border-radius:14px">
        <div class="k">Produto da Simulação</div>
        <div class="v" style="font-size:20px">Item X (alto giro)</div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
          <div>
            <label>Reposição (comprar agora)</label>
            <input id="buy" type="number" min="0" step="1" value="10">
          </div>
          <div>
            <label>Meta de estoque (referência)</label>
            <input id="target" type="number" readonly value="20">
          </div>
        </div>

        <div class="msg" id="msg">Clique em Iniciar.</div>
        <small>Regra: muita sobra gera “excesso” (custo parado). Falta gera “ruptura”.</small>
      </div>
    </section>

    <aside class="card">
      <div style="font-weight:1000;margin-bottom:8px">Histórico</div>
      <table>
        <thead><tr><th>Mês</th><th>Demanda</th><th>Comprou</th><th>Ruptura</th><th>Excesso</th><th>Pontos</th></tr></thead>
        <tbody id="log"></tbody>
      </table>
      <div class="msg" id="sum"></div>
    </aside>
  </div>
</div>

<script>
const AudioCtx=window.AudioContext||window.webkitAudioContext;let ctx=null;
function beep(k="ok"){try{if(!ctx)ctx=new AudioCtx();const t0=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
o.type="sine";o.frequency.value=k==="ok"?820:k==="done"?640:220;g.gain.setValueAtTime(0.0001,t0);
g.gain.exponentialRampToValueAtTime(0.16,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+(k==="done"?0.22:0.18));
o.connect(g);g.connect(ctx.destination);o.start(t0);o.stop(t0+(k==="done"?0.24:0.20));}catch(e){}}

const $=id=>document.getElementById(id);

let month=0, stock=0, rupt=0, score=0, running=false;

function demand(){
  const base=12+Math.floor(Math.random()*10);        // 12..21
  const spike = Math.random()<0.2 ? 10+Math.floor(Math.random()*10) : 0; // pico
  return base+spike;
}

function hud(){
  $("mth").textContent = `${Math.min(month,12)}/12`;
  $("stk").textContent = String(stock);
  $("rup").textContent = String(rupt);
  $("sc").textContent = String(score);
}

function setMsg(id,t,cls){
  const el=$(id);
  el.className="msg"+(cls?" "+cls:"");
  el.textContent=t||"";
}

function logRow(m,d,b,r,e,delta){
  const tr=document.createElement("tr");
  tr.innerHTML=`<td>${m}</td><td>${d}</td><td>${b}</td><td>${r}</td><td>${e}</td><td><strong style="color:var(--t)">${delta}</strong></td>`;
  $("log").appendChild(tr);
}

function start(){
  running=true;
  month=1; stock=18; rupt=0; score=0;
  $("log").innerHTML="";
  setMsg("sum","", "");
  setMsg("msg","Defina reposição e clique em Próximo mês.", "");
  hud();
  beep("done");
}

function step(){
  if(!running){ setMsg("msg","Clique em Iniciar primeiro.","bad"); beep("bad"); return; }
  if(month>12){
    setMsg("msg",`Fim do ano! Pontos finais: ${score}.`, "ok");
    setMsg("sum",`Resultado: rupturas=${rupt}.`, score>=120 && rupt===0 ? "ok" : "");
    beep("done");
    return;
  }

  const buy = Math.max(0, Number($("buy").value)||0);
  stock += buy;

  const d = demand();
  const sold = Math.min(stock, d);
  const r = Math.max(0, d - stock);
  stock -= sold;

  const excesso = Math.max(0, stock - 30); // acima de 30 é excesso

  let delta = 0;
  delta += sold * 2;        // venda boa
  delta -= r * 8;           // ruptura pesa
  delta -= excesso * 2;     // excesso pesa
  delta -= Math.floor(buy/6); // custo de compra leve

  score = Math.max(0, score + delta);
  if(r>0) rupt += 1;

  logRow(month,d,buy,r,excesso,delta);
  if(r>0){ setMsg("msg",`❌ Ruptura! Faltaram ${r} unidades.`, "bad"); beep("bad"); }
  else if(excesso>0){ setMsg("msg",`⚠ Excesso! Estoque parado (+${excesso}).`, ""); beep("ok"); }
  else { setMsg("msg","✅ Sem ruptura e sem excesso.", "ok"); beep("ok"); }

  month++;
  hud();

  if(month===13){
    setMsg("sum",`Ano concluído: Pontos=${score} • Rupturas=${rupt}.`, score>=120 && rupt===0 ? "ok" : "");
    beep("done");
  }
}

function reset(){
  running=false; month=0; stock=0; rupt=0; score=0;
  $("log").innerHTML="";
  setMsg("msg","Clique em Iniciar.", "");
  setMsg("sum","", "");
  hud();
  beep("bad");
}

$("start").onclick=start;
$("next").onclick=step;
$("reset").onclick=reset;

reset();
</script>
</body>
</html>
