<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>2º Ano — Contagem Cíclica | Inventário | ZyPlay</title>
<meta name="theme-color" content="#0b5f3c" />
<style>
:root{--bg:#0b0f19;--panel:rgba(16,24,43,.45);--line:rgba(255,255,255,.10);--t:#eaf0ff;--m:#a9b7d0;--ok:#23d5ab;--bad:#ff4d6d;--b:#0ea35a;--r:16px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--t);
background:radial-gradient(1000px 700px at 10% 0%, rgba(14,163,90,.22), transparent 55%),
radial-gradient(1000px 700px at 90% 0%, rgba(11,42,82,.18), transparent 55%),var(--bg);
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:min(1100px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.03)}
.brand{display:flex;align-items:center;gap:10px;font-weight:1000}
.badge{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--b),var(--ok));display:grid;place-items:center}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--t);padding:10px 12px;border-radius:999px;cursor:pointer;font-weight:900;transition:.15s}
button:hover{transform:translateY(-1px);background:rgba(255,255,255,.06)}
.primary{border-color:rgba(14,163,90,.35);background:rgba(14,163,90,.16)}
.danger{border-color:rgba(255,77,109,.35);background:rgba(255,77,109,.12)}
.b{padding:16px;display:grid;grid-template-columns:1.1fr .9fr;gap:12px}
@media(max-width:980px){.b{grid-template-columns:1fr}}
.card{padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03)}
.k{color:var(--m);font-size:12px;text-transform:uppercase;letter-spacing:.35px}
.v{font-weight:1000;font-size:18px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:10px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03)}
label{display:block;color:var(--m);font-size:12px;margin-bottom:6px}
input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.18);color:var(--t);outline:none}
.msg{min-height:18px;color:var(--m);font-size:13px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
th{color:var(--t);font-weight:1000}
small{color:var(--m)}
</style>
</head>
<body>
<div class="wrap">
  <div class="h">
    <div class="brand"><div class="badge">Z</div>
      <div>Contagem Cíclica (Inventário) <small style="display:block;color:var(--m);font-weight:700">2º Ano • ZyPlay</small></div>
    </div>
    <div class="ctrl">
      <button class="primary" id="start">Iniciar rodada</button>
      <button id="next">Próximo item</button>
      <button class="danger" id="reset">Reset</button>
    </div>
  </div>

  <div class="b">
    <section class="card">
      <div class="stats">
        <div class="stat"><div class="k">Item</div><div class="v" id="it">0/8</div></div>
        <div class="stat"><div class="k">Acertos</div><div class="v" id="ok">0</div></div>
        <div class="stat"><div class="k">Divergências</div><div class="v" id="dv">0</div></div>
        <div class="stat"><div class="k">Pontos</div><div class="v" id="sc">0</div></div>
      </div>

      <div style="height:10px"></div>

      <div class="card" style="border-radius:14px">
        <div class="k">SKU</div>
        <div class="v" id="sku" style="font-size:20px">—</div>
        <div class="k" style="margin-top:10px">Descrição</div>
        <div style="font-weight:900" id="desc">—</div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
          <div>
            <label>Quantidade no sistema</label>
            <input id="sys" type="number" readonly>
          </div>
          <div>
            <label>Contagem física (digite)</label>
            <input id="phy" type="number" placeholder="Ex: 12">
          </div>
        </div>

        <div class="msg" id="msg">Clique em Iniciar rodada.</div>
        <small>Regra: se diferença ≤ 1 unidade → “aceitável” (+8). Se diferença &gt; 1 → divergência (-4).</small>
      </div>
    </section>

    <aside class="card">
      <div style="font-weight:1000;margin-bottom:8px">Registro da rodada</div>
      <table>
        <thead><tr><th>SKU</th><th>Sistema</th><th>Físico</th><th>Dif</th><th>Status</th></tr></thead>
        <tbody id="log"></tbody>
      </table>
      <div class="msg" id="sum"></div>
    </aside>
  </div>
</div>

<script>
const AudioCtx=window.AudioContext||window.webkitAudioContext;let ctx=null;
function beep(k="ok"){try{if(!ctx)ctx=new AudioCtx();const t0=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
o.type="sine";o.frequency.value=k==="ok"?820:k==="done"?640:220;g.gain.setValueAtTime(0.0001,t0);
g.gain.exponentialRampToValueAtTime(0.16,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+(k==="done"?0.22:0.18));
o.connect(g);g.connect(ctx.destination);o.start(t0);o.stop(t0+(k==="done"?0.24:0.20));}catch(e){}}

const $=id=>document.getElementById(id);

const ITEMS=[
  {sku:"INV-101", desc:"Caderno A4 200 folhas", sys:18},
  {sku:"INV-114", desc:"Caneta esferográfica azul", sys:45},
  {sku:"INV-127", desc:"Papel A4 (resma)", sys:12},
  {sku:"INV-208", desc:"Teclado USB", sys:9},
  {sku:"INV-219", desc:"Mouse USB", sys:16},
  {sku:"INV-301", desc:"Grampeador metálico", sys:7},
  {sku:"INV-412", desc:"Caixa organizadora", sys:10},
  {sku:"INV-515", desc:"Fita adesiva larga", sys:14},
];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let deck=[], idx=0, ok=0, dv=0, sc=0, running=false;

function hud(){
  $("it").textContent = `${Math.min(idx+1,deck.length)}/${deck.length}`;
  $("ok").textContent = String(ok);
  $("dv").textContent = String(dv);
  $("sc").textContent = String(sc);
}

function setMsg(id,t,cls){
  const el=$(id);
  el.className="msg"+(cls?" "+cls:"");
  el.textContent=t||"";
}

function loadItem(){
  const it=deck[idx];
  $("sku").textContent=it.sku;
  $("desc").textContent=it.desc;
  $("sys").value=it.sys;
  $("phy").value="";
  $("phy").focus();
  setMsg("msg","Digite a contagem física e clique em Próximo item.","");
  hud();
}

function start(){
  running=true;
  deck=shuffle(ITEMS.map(x=>({...x})));
  idx=0; ok=0; dv=0; sc=0;
  $("log").innerHTML="";
  setMsg("sum","", "");
  loadItem();
  beep("done");
}

function commit(){
  const it=deck[idx];
  const phy = Number($("phy").value);
  if(!Number.isFinite(phy)){
    setMsg("msg","Digite uma contagem válida.","bad"); beep("bad"); return false;
  }
  const dif = Math.abs(phy - it.sys);
  let status="", delta=0;

  if(dif<=1){
    ok++; delta=8; sc+=delta; status="Aceitável";
    setMsg("msg",`✅ Diferença ${dif}. Aceitável (+${delta}).`,"ok"); beep("ok");
  }else{
    dv++; delta=-4; sc=Math.max(0, sc+delta); status="Divergência";
    setMsg("msg",`❌ Diferença ${dif}. Divergência (${delta}).`,"bad"); beep("bad");
  }

  const tr=document.createElement("tr");
  tr.innerHTML = `<td><strong style="color:var(--t)">${it.sku}</strong></td><td>${it.sys}</td><td>${phy}</td><td>${dif}</td><td>${status}</td>`;
  $("log").appendChild(tr);

  hud();
  return true;
}

function next(){
  if(!running){ setMsg("msg","Clique em Iniciar rodada.","bad"); beep("bad"); return; }
  if(!commit()) return;

  idx++;
  if(idx>=deck.length){
    running=false;
    setMsg("sum",`Rodada concluída! Pontos: ${sc} • Acertos: ${ok} • Divergências: ${dv}.`,"ok");
    setMsg("msg","Fim da rodada. Clique em Iniciar rodada para jogar novamente.","ok");
    beep("done");
    return;
  }
  loadItem();
}

function reset(){
  running=false; deck=[]; idx=0; ok=0; dv=0; sc=0;
  $("sku").textContent="—"; $("desc").textContent="—"; $("sys").value=""; $("phy").value="";
  $("log").innerHTML="";
  setMsg("msg","Clique em Iniciar rodada.","");
  setMsg("sum","", "");
  hud();
  beep("bad");
}

$("start").onclick=start;
$("next").onclick=next;
$("reset").onclick=reset;

reset();
</script>
</body>
</html>
