<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2º Ano — Matriz de Prioridades | ZyPlay</title>
<meta name="theme-color" content="#0b5f3c">

<style>
:root{
  --bg:#0b0f19;--panel:rgba(16,24,43,.45);--line:rgba(255,255,255,.10);
  --text:#eaf0ff;--ok:#23d5ab;--bad:#ff4d6d
}
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui;background:var(--bg);color:var(--text);
  display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px
}
.container{
  width:100%;max-width:1000px;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;padding:20px
}
h1{margin-top:0}
.task{margin:20px 0;font-weight:bold;font-size:18px}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
button{
  padding:12px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:white;font-weight:bold;cursor:pointer
}
button:hover{background:rgba(255,255,255,.08)}
.status{margin-top:15px;font-weight:bold}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.stats{margin-top:15px}
</style>
</head>
<body>

<div class="container">
<h1>Matriz de Prioridades</h1>
<p>Classifique a tarefa na categoria correta:</p>

<div class="task" id="task">Clique em iniciar</div>

<div class="grid">
<button onclick="responder('urgente_importante')">Urgente e Importante</button>
<button onclick="responder('importante_nao_urgente')">Importante, não urgente</button>
<button onclick="responder('urgente_nao_importante')">Urgente, não importante</button>
<button onclick="responder('nao_urgente_nao_importante')">Nem urgente nem importante</button>
</div>

<button style="margin-top:15px;" onclick="proxima()">Próxima</button>

<div class="status" id="status"></div>

<div class="stats">
  Pontos: <span id="score">0</span>
</div>

</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function beep(type="ok"){
  if(!audioCtx) audioCtx = new AudioCtx();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type="sine";
  osc.frequency.value = type==="ok"?800:200;
  gain.gain.setValueAtTime(0.2,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);
  osc.start();
  osc.stop(audioCtx.currentTime+0.2);
}

const tarefas=[
{t:"Entregar relatório com prazo hoje.",c:"urgente_importante"},
{t:"Planejar metas do próximo semestre.",c:"importante_nao_urgente"},
{t:"Responder mensagem sem relevância.",c:"nao_urgente_nao_importante"},
{t:"Atender ligação inesperada sem prioridade.",c:"urgente_nao_importante"}
];

let indice=0;
let score=0;

function mostrar(){
  if(indice>=tarefas.length){
    document.getElementById("task").innerText="Fim do jogo!";
    return;
  }
  document.getElementById("task").innerText=tarefas[indice].t;
}

function responder(resp){
  if(resp===tarefas[indice].c){
    score+=10;
    document.getElementById("status").innerText="Classificação correta!";
    document.getElementById("status").className="status ok";
    beep("ok");
  }else{
    score-=5;
    document.getElementById("status").innerText="Classificação incorreta.";
    document.getElementById("status").className="status bad";
    beep("bad");
  }
  document.getElementById("score").innerText=score;
}

function proxima(){
  indice++;
  mostrar();
}

mostrar();
</script>

</body>
</html>
