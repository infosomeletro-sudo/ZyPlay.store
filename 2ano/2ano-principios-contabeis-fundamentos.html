<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2º Ano — Princípios Contábeis | ZyPlay</title>
<meta name="theme-color" content="#0b5f3c">

<style>
:root{
  --bg:#0b0f19;
  --panel:rgba(16,24,43,.45);
  --line:rgba(255,255,255,.10);
  --text:#eaf0ff;
  --ok:#23d5ab;
  --bad:#ff4d6d;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px
}
.container{
  width:100%;
  max-width:950px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px
}
h1{margin-top:0}
.question{
  margin:20px 0;
  font-size:18px;
  font-weight:bold
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  color:white;
  font-weight:bold;
  cursor:pointer
}
button:hover{background:rgba(255,255,255,.08)}
.status{
  margin-top:15px;
  font-weight:bold
}
.ok{color:var(--ok)}
.bad{color:var(--bad)}
</style>
</head>
<body>

<div class="container">
<h1>Princípios Contábeis — Fundamentos</h1>

<div class="question" id="question">
Clique em Iniciar
</div>

<div id="options"></div>

<button onclick="startGame()">Iniciar</button>
<button onclick="nextQuestion()">Próxima</button>

<div class="status" id="status"></div>
<div>Pontos: <span id="score">0</span></div>

</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function beep(type="ok"){
  if(!audioCtx) audioCtx = new AudioCtx();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type="sine";
  osc.frequency.value = type==="ok"?800:200;
  gain.gain.setValueAtTime(0.2,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);
  osc.start();
  osc.stop(audioCtx.currentTime+0.2);
}

const perguntas=[
{
q:"Registrar receitas e despesas no período em que ocorrem é o princípio da:",
options:["Competência","Continuidade","Entidade","Prudência"],
correct:0
},
{
q:"Separar o patrimônio da empresa do patrimônio do proprietário refere-se ao princípio da:",
options:["Entidade","Oportunidade","Competência","Registro pelo Valor Original"],
correct:0
},
{
q:"Assumir que a empresa continuará operando no futuro refere-se ao princípio da:",
options:["Continuidade","Prudência","Entidade","Competência"],
correct:0
},
{
q:"Registrar bens pelo valor pago na aquisição refere-se ao princípio do:",
options:["Registro pelo Valor Original","Competência","Prudência","Continuidade"],
correct:0
},
{
q:"Diante de incertezas, registrar o menor valor para ativos e maior para passivos refere-se à:",
options:["Prudência","Competência","Entidade","Continuidade"],
correct:0
}
];

let indice=0;
let score=0;
let iniciado=false;

function startGame(){
  indice=0;
  score=0;
  iniciado=true;
  mostrar();
}

function mostrar(){
  if(indice>=perguntas.length){
    document.getElementById("question").innerText="Fim do jogo!";
    document.getElementById("options").innerHTML="";
    return;
  }

  const p=perguntas[indice];
  document.getElementById("question").innerText=p.q;

  const div=document.getElementById("options");
  div.innerHTML="";

  p.options.forEach((op,i)=>{
    const btn=document.createElement("button");
    btn.innerText=op;
    btn.onclick=()=>responder(i);
    div.appendChild(btn);
  });
}

function responder(i){
  if(!iniciado) return;

  if(i===perguntas[indice].correct){
    score+=10;
    document.getElementById("status").innerText="Correto!";
    document.getElementById("status").className="status ok";
    beep("ok");
  }else{
    score-=5;
    document.getElementById("status").innerText="Resposta incorreta.";
    document.getElementById("status").className="status bad";
    beep("bad");
  }

  document.getElementById("score").innerText=score;
}

function nextQuestion(){
  if(!iniciado) return;
  indice++;
  mostrar();
}
</script>

</body>
</html>
