<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2º Ano — Cronograma Inteligente | ZyPlay</title>
<meta name="theme-color" content="#0b5f3c">

<style>
:root{
  --bg:#0b0f19;--panel:rgba(16,24,43,.45);--line:rgba(255,255,255,.10);
  --text:#eaf0ff;--ok:#23d5ab;--bad:#ff4d6d
}
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui;background:var(--bg);color:var(--text);
  display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px
}
.container{
  width:100%;max-width:1000px;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;padding:20px
}
h1{margin-top:0}
table{
  width:100%;border-collapse:collapse;margin-top:15px
}
th,td{
  padding:8px;border-bottom:1px solid var(--line);text-align:left
}
th{color:#a9b7d0}
select{
  padding:6px;border-radius:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:white
}
button{
  margin-top:15px;padding:10px 14px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:white;font-weight:bold;cursor:pointer
}
button:hover{background:rgba(255,255,255,.08)}
.status{margin-top:15px;font-weight:bold}
.ok{color:var(--ok)} .bad{color:var(--bad)}
</style>
</head>
<body>

<div class="container">
<h1>Cronograma Inteligente</h1>
<p>Organize as tarefas conforme a ordem lógica de execução:</p>

<table>
<thead>
<tr>
<th>Tarefa</th>
<th>Ordem (1 a 4)</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<button onclick="corrigir()">Corrigir Ordem</button>

<div class="status" id="status"></div>
<div>Pontos: <span id="score">0</span></div>

</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function beep(type="ok"){
  if(!audioCtx) audioCtx = new AudioCtx();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type="sine";
  osc.frequency.value = type==="ok"?800:200;
  gain.gain.setValueAtTime(0.2,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);
  osc.start();
  osc.stop(audioCtx.currentTime+0.2);
}

const tarefas=[
{nome:"Definir objetivos",ordem:1},
{nome:"Planejar recursos",ordem:2},
{nome:"Executar atividades",ordem:3},
{nome:"Avaliar resultados",ordem:4}
];

let score=0;

function render(){
  const tabela=document.getElementById("tabela");
  tabela.innerHTML="";
  tarefas.sort(()=>Math.random()-0.5);

  tarefas.forEach((t,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${t.nome}</td>
      <td>
        <select id="sel${i}">
          <option value="">Escolher</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </td>
    `;
    tabela.appendChild(tr);
  });
}

function corrigir(){
  score=0;
  let erros=0;

  tarefas.forEach((t,i)=>{
    const escolha=document.getElementById("sel"+i).value;
    if(parseInt(escolha)===t.ordem){
      score+=10;
    }else{
      erros++;
      score-=5;
    }
  });

  document.getElementById("score").innerText=score;

  if(erros===0){
    document.getElementById("status").innerText="Cronograma correto!";
    document.getElementById("status").className="status ok";
    beep("ok");
  }else{
    document.getElementById("status").innerText="Há erros na sequência.";
    document.getElementById("status").className="status bad";
    beep("bad");
  }
}

render();
</script>

</body>
</html>
